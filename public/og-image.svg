<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B4513"/>
      <stop offset="100%" style="stop-color:#F5F0E8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Accent bar top -->
  <rect width="1200" height="4" fill="url(#accent)"/>

  <!-- Logo icon -->
  <g transform="translate(100, 180)">
    <rect width="64" height="64" rx="14" fill="url(#accent)"/>
    <text x="32" y="44" font-family="monospace" font-size="32" font-weight="bold" fill="white" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <!-- Title -->
  <text x="190" y="225" font-family="Inter, system-ui, sans-serif" font-size="56" font-weight="800" fill="white" letter-spacing="-1">DEVYANTRA</text>

  <!-- Tagline -->
  <text x="100" y="290" font-family="Inter, system-ui, sans-serif" font-size="28" fill="#94a3b8">Free Developer Tools — All Processing Done Locally</text>

  <!-- Divider -->
  <rect x="100" y="330" width="120" height="3" rx="2" fill="url(#accent)"/>

  <!-- Tool list -->
  <text x="100" y="390" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#64748b">
    <tspan x="100" dy="0">Text Compare</tspan>
    <tspan dx="30">Code Formatter</tspan>
    <tspan dx="30">Hash Generator</tspan>
    <tspan dx="30">Base64 Tools</tspan>
  </text>
  <text x="100" y="430" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#64748b">
    <tspan x="100" dy="0">JWT Decoder</tspan>
    <tspan dx="30">Timestamp Converter</tspan>
    <tspan dx="30">Character Counter</tspan>
    <tspan dx="30">Delimiter Tool</tspan>
  </text>

  <!-- URL -->
  <text x="100" y="530" font-family="monospace" font-size="22" fill="#8B4513">devyantra.app</text>

  <!-- Accent bar bottom -->
  <rect y="626" width="1200" height="4" fill="url(#accent)"/>
</svg>
